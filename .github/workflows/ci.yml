# Casebound CI gate. Per PRD decision D3, this hosted workflow is the source of
# truth behind the status badge. It installs the pinned toolchain and runs
# `make ci` on every supported Python, so the local gate and the badge cannot
# disagree. No secrets and no API keys: the gate is offline and key-free by design.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to commit SHAs, not mutable tags, so a compromised or
      # force-pushed upstream tag cannot change what runs in this workflow.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate only reads the tree, so the token is not left on disk for the
          # third-party code the install step runs.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and pinned dev toolchain
        run: make install

      - name: Run the gate
        run: make ci
