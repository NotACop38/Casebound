# Casebound CI gate. Per PRD decision D3 (Option A), this hosted workflow is the
# single source of truth behind the status badge. It does nothing but install the
# pinned toolchain and run `make ci`, so the local gate and the badge can never
# disagree. No secrets, no API keys: the gate is offline and key-free by design.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not mutable tags, so a compromised or
      # force-pushed upstream tag cannot change what runs in this workflow.
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the package and pinned dev dependencies
        run: make install

      - name: Run the gate
        run: make ci
