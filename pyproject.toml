[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casebound"
version = "0.1.0"
description = "Local-first DFIR investigation copilot whose AI narrative cannot invent facts."
readme = "README.md"
requires-python = ">=3.11"
# License intentionally unset until the D2 decision is signed off (PRD Section 17).
# The PRD leans Apache-2.0, but no LICENSE file is committed yet, so we do not
# publish a definitive license in package metadata. See the stop-and-ask rule.
authors = [{ name = "Casebound contributors" }]
keywords = [
    "dfir",
    "incident-response",
    "digital-forensics",
    "forensic-timeline",
    "mitre-attack",
    "grounded-generation",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

# Runtime dependencies. Pinned for reproducible offline builds.
dependencies = [
    "typer==0.26.7",
    "rich==15.0.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
# Pinned dev toolchain. Keep in lockstep with the CI gate (scripts/ci.py).
dev = [
    "pytest==9.0.2",
    "ruff==0.15.8",
    "mypy==1.19.1",
    "pre-commit==4.6.0",
    "bandit==1.9.4",
    "pip-audit==2.10.0",
    "detect-secrets==1.5.0",
    "types-python-dateutil==2.9.0.20260518",
    "types-jsonschema==4.26.0.20260518",
]

[project.scripts]
casebound = "casebound.cli:app"

[tool.setuptools.packages.find]
include = ["casebound*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["casebound", "scripts", "tests"]

[tool.ruff.lint]
# A pragmatic, strict-ish default set. Expand as the codebase grows.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
files = ["casebound", "scripts", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
# Keep the suite hermetic: no network, no API keys.
