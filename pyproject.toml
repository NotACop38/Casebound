[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casebound"
version = "0.1.0"
description = "Local-first DFIR investigation copilot whose AI narrative cannot invent facts."
readme = "README.md"
requires-python = ">=3.11"
# D2 (PRD Section 17) is signed off: Apache-2.0 for the core, LICENSE committed.
license = { text = "Apache-2.0" }
authors = [{ name = "Casebound contributors" }]
keywords = [
    "dfir",
    "incident-response",
    "digital-forensics",
    "forensic-timeline",
    "mitre-attack",
    "grounded-generation",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

# Runtime dependencies. Pinned for reproducible offline builds.
dependencies = [
    "typer==0.26.7",
    "rich==15.0.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
# Optional raw-artifact mode (PRD Section 5, decision D2). Dissect is AGPL-3.0, so
# it is deliberately NOT a core dependency: it is opt-in here and isolated to
# casebound/ingest/raw so the core stays Apache-2.0 with no AGPL code on its import
# path. Installing this extra (pip install "casebound[raw]") and using raw mode
# brings AGPL-3.0 code into the assembled work, which is then subject to its terms.
# The license boundary is enforced by tests/test_license_boundary.py.
raw = [
    "dissect.eventlog==3.11",
    "dissect.ntfs==3.16",
]
# Pinned dev toolchain. Keep in lockstep with the CI gate (scripts/ci.py).
dev = [
    "pytest==9.0.3",
    "ruff==0.15.8",
    "mypy==1.19.1",
    "pre-commit==4.6.0",
    "bandit==1.9.4",
    "pip-audit==2.10.0",
    "detect-secrets==1.5.0",
    "types-python-dateutil==2.9.0.20260518",
    "types-jsonschema==4.26.0.20260518",
]

[project.scripts]
casebound = "casebound.cli:app"

[tool.setuptools.packages.find]
include = ["casebound*"]

[tool.setuptools.package-data]
# The HTML report template is loaded from the installed package at runtime, so it
# must ship inside the wheel and sdist; without this a non-editable install would
# omit it and render_report would raise TemplateNotFound.
"casebound.report" = ["templates/*.j2"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["casebound", "scripts", "tests"]

[tool.ruff.lint]
# A pragmatic, strict-ish default set. Expand as the codebase grows.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters with calls in argument defaults by design; these
# are evaluated once and are effectively immutable singletons.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
files = ["casebound", "scripts", "tests"]

[[tool.mypy.overrides]]
# Dissect is an optional, AGPL-gated dependency (raw mode, decision D2). It is not
# installed in the core CI environment and ships no type stubs we vendor, so its
# absence must not fail the type gate. The raw adapters treat Dissect objects as
# untyped at the boundary and distil them into typed dataclasses immediately.
module = ["dissect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
# Keep the suite hermetic: no network, no API keys.
markers = [
    "invariant: defensive-scope invariant tests (PRD Section 6, Hard rule 1); run as a named step by 'make security'.",
]
