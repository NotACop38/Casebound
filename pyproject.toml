[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "casebound"
version = "0.2.0"
description = "Offline DFIR case reports whose narrative is verified, claim by claim, against the evidence timeline."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Casebound contributors" }]
keywords = [
    "dfir",
    "incident-response",
    "digital-forensics",
    "forensic-timeline",
    "hayabusa",
    "mitre-attack",
    "grounded-generation",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

# Runtime dependencies, pinned for reproducible offline installs. The deterministic
# core needs nothing else: no model SDK, no web framework, no network client.
dependencies = [
    "typer==0.27.2",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
# Narrative providers (all optional; the deterministic report needs none). The
# local provider talks to an OpenAI-compatible server on this host (Ollama,
# llama.cpp, vLLM, LM Studio) through the openai client, so 'local' and 'openai'
# install the same package. SDKs are imported lazily, only when a provider is used.
local = ["openai==3.19.2"]
openai = ["openai==3.19.2"]
anthropic = ["anthropic==1.8.0"]
# Raw-artifact mode (decision D2). Dissect is AGPL-3.0, so it is deliberately not a
# core dependency: it is opt-in here and isolated to casebound/ingest/raw, loaded
# only through casebound/sources.py when an operator selects a raw source, so the
# core stays Apache-2.0 with no AGPL code on its import path. Installing this extra
# and using raw mode brings AGPL-3.0 code into the assembled work, which is then
# subject to its terms. tests/test_license_boundary.py enforces the boundary.
raw = [
    "dissect.eventlog==3.11",
    "dissect.ntfs==3.16",
]
# The optional local web viewer (decision D4): 'casebound serve'. It reuses the
# pipeline and the report layer unchanged, binds loopback by default, and never
# fetches anything, so a default install pulls in no web framework.
web = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]
# The pinned development toolchain, kept in lockstep with the gate (scripts/ci.py).
# It includes the web extra and its in-process test client so the gate exercises
# the viewer's tests instead of skipping them, and both provider SDKs so the
# provider tests run against the real client types (no network is used).
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "detect-secrets==1.5.0",
    "types-python-dateutil==2.9.0.20260807",
    "types-jsonschema==4.26.0.20260518",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "httpx2==2.13.1",
    "anthropic==1.8.0",
    "openai==3.19.2",
]

[project.urls]
Homepage = "https://github.com/NotACop38/Casebound"
Documentation = "https://github.com/NotACop38/Casebound/tree/main/docs"
Changelog = "https://github.com/NotACop38/Casebound/blob/main/CHANGELOG.md"
Issues = "https://github.com/NotACop38/Casebound/issues"

[project.scripts]
casebound = "casebound.cli:app"

[tool.setuptools.packages.find]
include = ["casebound*"]

[tool.setuptools.package-data]
# Loaded from the installed package at runtime, so they must ship in the wheel:
# the event and claim schemas and the bundled ATT&CK catalog, the report template,
# the web viewer's templates, and the PEP 561 marker.
"casebound" = ["py.typed", "data/*.json"]
"casebound.report" = ["templates/*.j2"]
"casebound.web" = ["templates/*.j2"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["casebound"]

[tool.ruff.lint.flake8-bugbear]
# Typer and FastAPI both declare parameters with calls in argument defaults by
# design; these are evaluated once and are effectively immutable singletons.
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
files = ["casebound", "scripts", "tests"]

[[tool.mypy.overrides]]
# Dissect is an optional, AGPL-gated dependency (raw mode, decision D2). It is not
# installed in the core CI environment and ships no type stubs we vendor, so its
# absence must not fail the type gate. The raw adapters treat Dissect objects as
# untyped at the boundary and distil them into typed dataclasses immediately.
module = ["dissect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
xfail_strict = true
# Keep the suite hermetic: no network, no API keys.
markers = [
    "invariant: defensive-scope invariant tests (PRD Section 6, Hard rule 1); run as a named step by 'make security'.",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["casebound"]
branch = true
# The raw adapters need the optional AGPL extra, which the gate does not install;
# their pure logic is tested through fakes in tests/test_dissect_raw.py.
omit = ["casebound/ingest/raw/_loader.py", "casebound/web/__main__.py"]

[tool.coverage.report]
show_missing = false
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
